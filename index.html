<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas FC</title>
  <link rel="icon" href="assets/logo/favicon/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="min-h-screen bg-[#030d13] bg-[url('assets/background/main.png')] bg-cover bg-center bg-fixed text-white font-sans">

  <header class="min-h-[132px] mx-[4%] px-7 py-3 items-center justify-between gap-5 border border-[#c4a65e] border-t-0 rounded-b-[26px] shadow-xl grid grid-cols-1 md:grid-cols-[auto_1fr_auto]">

    <a href="index.html" class="flex items-center gap-5 shrink-0">
      <img src="assets/logo/logo.png" alt="Atlas FC" class="w-16 h-16 object-contain">
    </a>

    <ul aria-label="Légende des postes" class="flex flex-1 flex-wrap justify-center gap-4 xl:gap-9 font-bold">
      <li><i class="inline-block size-4 rounded-full shrink-0 bg-amber-400"></i> GB</li>
      <li><i class="inline-block size-4 rounded-full shrink-0 bg-blue-500"></i> DEF</li>
      <li><i class="inline-block size-4 rounded-full shrink-0 bg-emerald-500"></i> MIL</li>
      <li><i class="inline-block size-4 rounded-full shrink-0 bg-red-500"></i> ATT</li>
    </ul>

    <label class="bg-[#071923] border border-[#29414c] rounded-xl px-4 py-3 whitespace-nowrap font-bold">
      Schéma
      <select aria-label="Schéma" class="ml-2 bg-[#0a1820] border border-[#263a43] rounded-lg p-2 text-white appearance-none">
        <option>4-4-2</option>
      </select>
    </label>
  </header>

  <main aria-label="Tableau de bord de l’équipe" class="grid grid-cols-1 lg:grid-cols-[350px_minmax(0,1fr)] 2xl:grid-cols-[420px_minmax(0,1fr)] gap-4 px-[2%] py-3 min-h-[calc(100vh-132px)]">

    <aside class="min-w-0 overflow-hidden p-4 rounded-2xl border border-[#c7a95b] bg-[#03151bf2] shadow-[inset_0_0_15px_#0e3636] grid content-start">

      <button id="openPlayerModal" type="button" class="w-full rounded-xl border border-[#ffe080] bg-gradient-to-b from-[#f2cf63] to-[#bb8e26] px-4 py-4 text-[#071018] text-lg font-extrabold shadow-lg hover:brightness-110">
        ＋ &nbsp; Ajouter un joueur
      </button>

      <section class="mt-4 mb-5">
        <header class="flex items-center justify-between mb-3">
          <h2 class="text-white font-bold text-lg">Effectif</h2>
          <p class="bg-slate-800 border border-slate-700 text-white text-sm px-3 py-1 rounded-lg">
            <span id="playerCount">0</span> joueur(s)
          </p>
        </header>
        <p id="placedCount" class="text-slate-300 text-sm" aria-live="polite">Joueurs placés : 0 / 11</p>
        <p class="text-slate-400 text-sm">
          Cliquez sur un joueur placé pour voir sa case sur le terrain.
          <i class="fa-solid fa-pen text-white"></i> pour modifier,
          <i class="fa-solid fa-trash text-white"></i> pour supprimer.
        </p>
      </section>

      <ul id="playerList" class="list-none p-0 m-0 h-[525px] max-h-[65vh] overflow-y-auto overflow-x-hidden"></ul>
    </aside>

    <section aria-label="Terrain" class="min-w-0 rounded-2xl border border-[#c7a95b] bg-[#03151bf2] p-3 shadow-[inset_0_0_15px_#0e3636] grid grid-rows-1">
      <figure aria-label="Composition tactique 4-4-2" class="relative flex-1 min-h-[430px] md:min-h-[610px] rounded-xl overflow-hidden bg-[url('assets/background/ter.png')] bg-center bg-[length:100%_100%] bg-no-repeat m-0">
        <div class="terrain-grid" aria-label="Onze positions du terrain">
          <div class="pitch-slot gb" data-position="gb" data-role="GB" aria-label="GB : Libre"><span class="slot-status">GB · Libre</span></div>
          <div class="pitch-slot dg" data-position="dg" data-role="DEF" aria-label="DG : Libre"><span class="slot-status">DG · Libre</span></div>
          <div class="pitch-slot dc1" data-position="dc1" data-role="DEF" aria-label="DC1 : Libre"><span class="slot-status">DC1 · Libre</span></div>
          <div class="pitch-slot dc2" data-position="dc2" data-role="DEF" aria-label="DC2 : Libre"><span class="slot-status">DC2 · Libre</span></div>
          <div class="pitch-slot dd" data-position="dd" data-role="DEF" aria-label="DD : Libre"><span class="slot-status">DD · Libre</span></div>
          <div class="pitch-slot mg" data-position="mg" data-role="MIL" aria-label="MG : Libre"><span class="slot-status">MG · Libre</span></div>
          <div class="pitch-slot mc1" data-position="mc1" data-role="MIL" aria-label="MC1 : Libre"><span class="slot-status">MC1 · Libre</span></div>
          <div class="pitch-slot mc2" data-position="mc2" data-role="MIL" aria-label="MC2 : Libre"><span class="slot-status">MC2 · Libre</span></div>
          <div class="pitch-slot md" data-position="md" data-role="MIL" aria-label="MD : Libre"><span class="slot-status">MD · Libre</span></div>
          <div class="pitch-slot bu1" data-position="bu1" data-role="ATT" aria-label="BU1 : Libre"><span class="slot-status">BU1 · Libre</span></div>
          <div class="pitch-slot bu2" data-position="bu2" data-role="ATT" aria-label="BU2 : Libre"><span class="slot-status">BU2 · Libre</span></div>
        </div>
      </figure>
    </section>

  </main>

  <div id="playerModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="fixed inset-0 z-[9999] hidden items-center justify-center bg-[#020617]/80 p-4 backdrop-blur-sm">
    <section id="modalContent" class="w-full max-w-[510px] max-h-[90vh] overflow-y-auto rounded-2xl border border-slate-600/60 bg-[#1e293b] p-6 sm:p-7 text-white shadow-2xl">

      <header class="mb-7 flex items-center justify-between">
        <h2 id="modalTitle" class="text-xl font-extrabold">Ajouter un joueur</h2>
        <button id="closePlayerModal" type="button" aria-label="Fermer" class="rounded-lg p-2 text-slate-400 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </header>

      <form id="playerForm" class="space-y-7">

        <div>
          <label for="playerName" class="mb-2 block text-sm font-semibold text-slate-400">Nom complet</label>
          <input id="playerName" name="name" type="text" required placeholder="Ex. Hamza Hakkache" class="w-full rounded-xl border border-slate-600 bg-[#0f172a] px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30">
          <small id="nameError" class="block mt-2 text-red-400 text-xs" aria-live="polite"></small>
        </div>

        <fieldset>
          <legend class="mb-3 text-sm font-semibold text-slate-400">Poste</legend>
          <div class="grid grid-cols-2 gap-3">

            <label class="cursor-pointer">
              <input class="peer sr-only" type="radio" name="poste" value="GB" required>
              <span class="flex items-center gap-2 rounded-xl border border-slate-700 bg-[#0f172a] px-3 py-2.5 font-medium transition hover:border-slate-500 peer-checked:border-blue-500 peer-checked:bg-blue-500/15 peer-focus-visible:ring-2 peer-focus-visible:ring-blue-400">
                <img src="assets/players/goolkeeper.png" alt="" class="h-7 w-7 object-contain">
                Gardien
              </span>
            </label>

            <label class="cursor-pointer">
              <input class="peer sr-only" type="radio" name="poste" value="DEF">
              <span class="flex items-center gap-2 rounded-xl border border-slate-700 bg-[#0f172a] px-3 py-2.5 font-medium transition hover:border-slate-500 peer-checked:border-blue-500 peer-checked:bg-blue-500/15 peer-focus-visible:ring-2 peer-focus-visible:ring-blue-400">
                <img src="assets/players/def-player.png" alt="" class="h-7 w-7 object-contain">
                Défenseur
              </span>
            </label>

            <label class="cursor-pointer">
              <input class="peer sr-only" type="radio" name="poste" value="MIL">
              <span class="flex items-center gap-2 rounded-xl border border-slate-700 bg-[#0f172a] px-3 py-2.5 font-medium transition hover:border-slate-500 peer-checked:border-blue-500 peer-checked:bg-blue-500/15 peer-focus-visible:ring-2 peer-focus-visible:ring-blue-400">
                <img src="assets/players/mil-player.png" alt="" class="h-7 w-7 object-contain">
                Milieu
              </span>
            </label>

            <label class="cursor-pointer">
              <input class="peer sr-only" type="radio" name="poste" value="ATT">
              <span class="flex items-center gap-2 rounded-xl border border-slate-700 bg-[#0f172a] px-3 py-2.5 font-medium transition hover:border-slate-500 peer-checked:border-blue-500 peer-checked:bg-blue-500/15 peer-focus-visible:ring-2 peer-focus-visible:ring-blue-400">
                <img src="assets/players/att-player.png" alt="" class="h-7 w-7 object-contain">
                Attaquant
              </span>
            </label>

          </div>
          <small id="posteError" class="block mt-2 text-red-400 text-xs" aria-live="polite"></small>
        </fieldset>

        <div>
          <label for="playerNumber" class="mb-2 block text-sm font-semibold text-slate-400">Numéro (1 à 99)</label>
          <input id="playerNumber" name="number" type="number" min="1" max="99" required placeholder="Ex. 7" class="w-full rounded-xl border border-slate-600 bg-[#0f172a] px-4 py-3 text-white placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30">
          <small id="numberError" class="block mt-2 text-red-400 text-xs" aria-live="polite"></small>
        </div>

        <footer class="flex justify-end gap-3 pt-2">
          <button id="cancelPlayerModal" type="button" class="rounded-xl bg-slate-700 px-5 py-3 font-semibold transition hover:bg-slate-600">Annuler</button>
          <button type="submit" class="rounded-xl border border-[#ffe080] bg-gradient-to-b from-[#f2cf63] to-[#bb8e26] px-5 py-3 text-[#071018] font-extrabold shadow-lg transition hover:brightness-110">Ajouter</button>

        </footer>

      </form>
    </section>
  </div>

  <section id="confirmBar" role="alertdialog" aria-labelledby="confirmText" class="fixed bottom-4 left-[4%] right-[4%] z-[10000] hidden flex-col sm:flex-row items-center justify-between gap-4 rounded-2xl border-2 border-green-500 bg-[#03151bf2] px-6 py-4 shadow-2xl backdrop-blur-sm">
    <p id="confirmText" class="font-semibold text-white"></p>
    <div class="flex gap-3">
      <button id="cancelDelete" type="button" class="rounded-xl bg-slate-700 px-5 py-2.5 font-semibold transition hover:bg-slate-600">Annuler</button>
      <button id="confirmDelete" type="button" class="rounded-xl bg-green-500 px-5 py-2.5 font-bold text-[#071018] transition hover:brightness-110">Supprimer</button>
    </div>
  </section>

  <div id="notification" role="status" aria-live="polite" class="fixed top-5 right-5 z-[10001] hidden rounded-xl border border-[#c7a95b] bg-[#102731] px-5 py-3 text-white shadow-xl"></div>
  <script src="main.js"></script>
</body>

</html>
